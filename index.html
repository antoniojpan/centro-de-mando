<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Mando</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="wrap">

    <header class="top">
      <div>
        <h1>Centro <span>de Mando</span></h1>
        <div class="sub">
          <span id="fecha-datos">Cargando…</span> · <span id="modo">…</span>
        </div>
      </div>
      <div class="kpis">
        <div class="kpi">
          <div class="lbl">Saldo total</div>
          <div class="val" id="kpi-saldo">—</div>
        </div>
        <div class="kpi">
          <div class="lbl">Unidades hoy</div>
          <div class="val" id="kpi-hoy">—</div>
        </div>
        <button id="btn-cfg" class="btn-cfg" title="Configurar la API">⚙</button>
      </div>
    </header>

    <section id="cfg" class="cfg oculto">
      <p class="cfg-txt">
        Pega aquí la URL de la aplicación web de Apps Script (termina en <code>/exec</code>)
        y la clave. Se guardan solo en este navegador.
      </p>
      <label>URL de la API <input id="cfg-url" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label>Clave <input id="cfg-clave" type="password" placeholder="clave compartida"></label>
      <div class="cfg-acciones">
        <button id="cfg-guardar" class="btn">Guardar</button>
        <button id="cfg-borrar" class="btn btn-sec">Desconectar</button>
      </div>
    </section>

    <section class="card">
      <h2>Saldo por tipo <em>superávit / déficit acumulado</em></h2>
      <div class="grid" id="tipos"></div>
      <div id="barras"></div>
    </section>

    <section class="card">
      <h2>Evolución del saldo total <em>últimos 60 días registrados</em></h2>
      <div id="linea"></div>
    </section>

    <footer id="generado">Cargando datos…</footer>

  </div>

  <div id="aviso" class="aviso oculto"></div>

  <script src="assets/app.js"></script>
</body>
</html>
