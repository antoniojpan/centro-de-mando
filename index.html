<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Mando</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="wrap">

    <header class="top">
      <div>
        <h1>Centro <span>de Mando</span></h1>
        <div class="sub" id="fecha-datos">Cargando…</div>
      </div>
      <div class="kpis">
        <div class="kpi">
          <div class="lbl">Saldo total</div>
          <div class="val" id="kpi-saldo">—</div>
        </div>
        <div class="kpi">
          <div class="lbl">Unidades hoy</div>
          <div class="val" id="kpi-hoy">—</div>
        </div>
      </div>
    </header>

    <section class="card">
      <h2>Saldo por tipo <em>superávit / déficit acumulado</em></h2>
      <div class="grid" id="tipos"></div>
      <div id="barras"></div>
    </section>

    <section class="card">
      <h2>Evolución del saldo total <em>últimos 60 días registrados</em></h2>
      <div id="linea"></div>
    </section>

    <footer id="generado">Cargando datos…</footer>

  </div>
  <script src="assets/app.js"></script>
</body>
</html>
